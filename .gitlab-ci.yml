# ===========================================
# GitLab CI/CD Pipeline
# ===========================================
# This pipeline defines the Continuous Integration (CI) process for the project.
# It runs automatically on pushes and merge requests.
#
# The pipeline performs:
#   1. Build                    → ensures code compiles
#   2.1 Unit Tests              → check for any logic errors
#   2.2 Memory Management Check → runs Valgrind for memory leaks and errors
#   3. Coding Conventions       → runs cpplint to enforce style guidelines
#   4. Security issues          → uses GitLab SAST (CodeQL-based) to find vulnerabilities
#
# Goal: Detect issues early and guarantee code correctness, stability,
#       and style compliance before merging and deploy.

# All pipeline jobs/tasks
stages:
  - lint
  - build
  - test
  - security

# Global variables
variables:
  VCPKG_ROOT: ${CI_PROJECT_DIR}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${CI_PROJECT_DIR}/.vcpkg_cache

# =====================
# Build
# =====================
build:
  stage: build
  image: ubuntu:22.04
  before_script:
    # Install system dependencies
    - apt-get update && apt-get install -y cmake g++ valgrind python3-pip git curl zip unzip tar pkg-config
    # Setup vcpkg cache directory
    - mkdir -p $VCPKG_DEFAULT_BINARY_CACHE
    # Install vcpkg (only if not cached)
    - |
      if [ ! -f "$VCPKG_ROOT/vcpkg" ]; then
        git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
        $VCPKG_ROOT/bootstrap-vcpkg.sh
      fi
    # Install project dependencies
    - $VCPKG_ROOT/vcpkg install --triplet x64-linux
  script:
    - rm -rf build
    - mkdir -p build
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake | tee build/cmake_output.log
    - cmake --build build 2>&1 | tee build/build_output.log
    # Count and report warnings (informational only, won't block build)
    - |
      echo ""
      echo "========================================"
      echo "         COMPILER WARNINGS REPORT       "
      echo "========================================"
      WARNING_COUNT=$(grep -c "warning:" build/build_output.log || echo "0")
      echo "Total warnings found: $WARNING_COUNT"
      echo "========================================"
      if [ "$WARNING_COUNT" -gt "0" ]; then
        echo "⚠️  Warnings found:"
        grep "warning:" build/build_output.log | head -30
        echo ""
        echo "(showing first 30 warnings)"
      else
        echo "✅ No warnings! Great job!"
      fi
  cache:
    key: vcpkg-$CI_COMMIT_REF_SLUG
    paths:
      - .vcpkg_cache/
      - vcpkg/
  artifacts:
    when: always
    paths:
      - build/
    expire_in: 1 week

# =====================
# Lexer Tests
# =====================
test-lexer:
  stage: test
  image: ubuntu:22.04
  needs:
    - job: build
      artifacts: true 
  script:
    - apt-get update && apt-get install -y valgrind
    - ln -s $CI_PROJECT_DIR/tests /tests
    - chmod +x build/unit_tests
    # Run tests
    - mkdir -p build/test_results
    - ./build/unit_tests --gtest_filter=LexerTest.* --gtest_output=xml:build/test_results/lexer.xml
    # Memory check
    - valgrind --leak-check=full ./build/unit_tests --gtest_filter=LexerTest.*
  artifacts:
    reports:
      junit: build/test_results/lexer.xml
    paths:
      - build/test_results/
    expire_in: 1h

