# =============================
# Coding Conventions Checker
# =============================
check-conventions:
  stage: lint
  image: python:3.11
  allow_failure: true  # job won't fail pipeline if lint fails
  script:
    - pip install cpplint
    - mkdir -p conventions_results
    - cpplint --recursive src/ include/ tests/ 2>&1 | tee conventions_results/cpplint.log
    # Fail explicitly if lint errors detected
    - if grep -q "Total errors found:" conventions_results/cpplint.log; then exit 1; fi
  artifacts:
    paths:
      - conventions_results/cpplint.log
    expire_in: 1h

# =============================
# Security Issues Checker (SAST)
# =============================
include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: security
  needs: []
